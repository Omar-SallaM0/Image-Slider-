<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="slider-container">
        <div id="slide-number" class="slide-number"></div>
        <img decoding="async" src="./Screenshot (1).png" alt="" />
        <img decoding="async" src="./Screenshot (2).png" alt="" />
        <img decoding="async" src="./Screenshot (3).png" alt="" />
        <img decoding="async" src="./Screenshot (4).png" alt="" />
        <img decoding="async" src="./Screenshot (5).png" alt="" />
    </div>
    <div class="slider-controls">
        <span id="prev" class="prev">Previous</span>
        <span id="indicators" class="indicators"></span>
        <span id="next" class="next">Next</span>
    </div>
    <script src = "main.js"></script>
</body>
</html>
